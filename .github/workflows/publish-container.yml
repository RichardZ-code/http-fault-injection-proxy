name: Publish reviewed container

'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full source SHA
        required: true
        type: string
      version:
        description: Proposed vMAJOR.MINOR.PATCH
        required: true
        type: string
      preparation_run:
        description: Explicit successful Prepare release candidate run ID
        required: true
        type: string
      preparation_attempt:
        description: Explicit reviewed run attempt
        required: true
        type: string
      provenance_sha256:
        description: Reviewed PROVENANCE.json SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    concurrency:
      group: container-promotion-${{ github.repository }}-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      PREP_RUN: ${{ inputs.preparation_run }}
      PREP_ATTEMPT: ${{ inputs.preparation_attempt }}
      PROVENANCE_HASH: ${{ inputs.provenance_sha256 }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed preparation and existing frozen tag
        run: |
          set -euo pipefail
          python3 scripts/release.py run-check --source "$SOURCE" --version "$VERSION" --repository "$REPOSITORY" --run-id "$PREP_RUN" --attempt "$PREP_ATTEMPT"
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$SOURCE"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-${{ inputs.source_sha }}-${{ inputs.version }}-${{ inputs.preparation_attempt }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preparation_run }}
          digest-mismatch: error
      - name: Verify reviewed bytes, then load and promote without rebuilding
        run: |
          set -euo pipefail
          python3 scripts/release.py candidate-check --source "$SOURCE" --version "$VERSION" --repository "$REPOSITORY" --run-id "$PREP_RUN" --attempt "$PREP_ATTEMPT" --hash "$PROVENANCE_HASH" --directory "$RUNNER_TEMP/candidate"
          image_id=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["image_id"])' "$RUNNER_TEMP/candidate/image.json")
          docker load --input "$RUNNER_TEMP/candidate/image.tar"
          test "$(docker image inspect --format '{{.Id}}' "$image_id")" = "$image_id"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          export DOCKER_CONFIG="$RUNNER_TEMP/promotion-auth"
          target="ghcr.io/${REPOSITORY,,}:$VERSION"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$DOCKER_CONFIG/config.json"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$target" >"$RUNNER_TEMP/existing.json" 2>"$RUNNER_TEMP/existing.stderr"; then
            echo 'Refusing to overwrite an existing published tag'; exit 1
          fi
          # Authentication/network errors do not prove the tag is absent.
          grep -Eq 'manifest unknown|no such manifest' "$RUNNER_TEMP/existing.stderr"
          docker tag "$image_id" "$target"
          docker push "$target" | tee "$RUNNER_TEMP/promotion.log"
          docker image inspect "$target" --format '{{json .RepoDigests}}' | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Reviewed Docker store image ID: %s\n' "$image_id" >>"$GITHUB_STEP_SUMMARY"
      - name: Preserve promotion diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion.log
            ${{ runner.temp }}/existing.stderr
          retention-days: 14
          if-no-files-found: warn
